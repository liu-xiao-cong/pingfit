<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7ef">
  <title>更新 PingFit · 找回视频教学</title>
  <link rel="stylesheet" href="./update.css">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <span class="brand">Ping<span>Fit</span></span>
    <div class="mark" aria-hidden="true">↻</div>
    <h1>让视频教学显示出来</h1>
    <p>旧版可能仍在显示文字步骤。更新应用后，动作详情会出现视频教学入口。</p>
    <div class="notice">训练记录、照片和昵称继续保留在这台设备。请先保存其他 PingFit 页面里正在编辑的内容。</div>
    <button id="update-button" type="button">更新并查看视频</button>
    <p id="update-status" role="status" aria-live="polite">准备更新应用资源，不会清除个人数据。</p>
    <a href="./#train">返回训练动作</a>
  </main>
  <script type="module" src="./update.js"></script>
</body>
</html>
