<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="PingFit：按部位寻找训练动作，记录每一组重量、有氧与照片，看见每一次进步。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>PingFit · 每一次认真，都有迹可循</title>
</head>
<body>
  <a class="skip-link" href="#content">跳转到主要内容</a>
  <aside class="sidebar" aria-label="主导航"></aside>
  <div class="app-shell">
    <header id="app-header"></header>
    <main id="content" tabindex="-1"><div class="loading"><span class="spinner"></span>正在打开你的训练空间…</div></main>
    <footer class="app-footer">PINGFIT <span>记录当下，看见进步。</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="手机导航"></nav>
  <dialog id="modal" aria-modal="true"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="photo-input" type="file" accept="image/*" multiple hidden>
  <input id="recognize-input" type="file" accept="image/*" hidden>
  <input id="backup-input" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./app.js"></script>
  <noscript>PingFit需要启用 JavaScript 才能记录与保存训练。</noscript>
</body>
</html>
